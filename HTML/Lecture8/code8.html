<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- table tag : tag is used to display data in a structured format using rows and columns.
     table caption tr - table row 
     th - header cell
     td - data cell
     colgroup - group of columns
     col - individual column-->
     <table>
        <caption>Employee Details</caption>
        <tr>
            <th>Employee Name</th>
            <th>Employee Roll</th>
            <th>Company Name</th>
            <th>Salary </th>
        </tr>
        <tr>
            <td>Ashish</td>
            <td>SDE</td>
            <td>Barclays</td>
            <td>1.7</td>
        </tr>
        <tr>
            <td>Kanha</td>
            <td>STE</td>
            <td>Infosys</td>
            <td>1.5</td>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>Support Engineer</td>
            <td>BMC software</td>
            <td>1.2</td>
        </tr>
        <colgroup>
            <col style = "background-color: red;">
            <col>
            <col style = "background-color: blue;">
            </colgroup>  
     </table>
</body>
</html>
